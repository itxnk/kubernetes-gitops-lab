apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/itxnk/kubernetes-gitops-lab.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
